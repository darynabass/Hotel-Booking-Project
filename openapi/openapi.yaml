
openapi: 3.0.3

info:
  title: Hotel Booking API
  description: REST API for managing hotels and hotel rooms.
  version: 1.0.0
  contact:
    name: Daryna Bass

servers:
  - url: http://localhost:8000/api/v1
    description: Development server

tags:
  - name: Hotels
    description: Operations for managing hotels
  - name: Rooms
    description: Operations for managing hotel rooms

paths:

  /hotels:
    get:
      tags:
        - Hotels
      summary: Get all hotels
      operationId: getHotels
      responses:
        '200':
          description: List of hotels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hotel'
        '500':
          description: Internal server error

    post:
      tags:
        - Hotels
      summary: Create a hotel
      operationId: createHotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelInput'
            example:
              name: Grand Hotel
              address: Main Street 10
              city: Berlin
              description: Modern hotel in the city center
              phone: "+49301234567"
              email: info@grandhotel.com
      responses:
        '201':
          description: Hotel created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '400':
          description: Invalid request
        '422':
          description: Validation error

  /hotels/{hotelId}:
    parameters:
      - name: hotelId
        in: path
        required: true
        description: Unique hotel identifier
        schema:
          type: integer
          example: 1

    get:
      tags:
        - Hotels
      summary: Get a hotel by ID
      operationId: getHotelById
      responses:
        '200':
          description: Hotel found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '404':
          description: Hotel not found

    put:
      tags:
        - Hotels
      summary: Update a hotel
      operationId: updateHotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelInput'
      responses:
        '200':
          description: Hotel updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '404':
          description: Hotel not found
        '422':
          description: Validation error

    delete:
      tags:
        - Hotels
      summary: Delete a hotel
      operationId: deleteHotel
      responses:
        '204':
          description: Hotel deleted successfully
        '404':
          description: Hotel not found
        '409':
          description: Hotel has associated rooms

  /rooms:
    get:
      tags:
        - Rooms
      summary: Get all rooms
      operationId: getRooms
      parameters:
        - name: hotelId
          in: query
          required: false
          description: Filter rooms by hotel ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '400':
          description: Invalid query parameter

    post:
      tags:
        - Rooms
      summary: Create a room
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
            example:
              hotelId: 1
              roomNumber: "101"
              type: double
              pricePerNight: 120.0
              capacity: 2
              description: Double room with city view
      responses:
        '201':
          description: Room created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Hotel not found
        '409':
          description: Room number already exists in this hotel
        '422':
          description: Validation error

  /rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        description: Unique room identifier
        schema:
          type: integer
          example: 1

    get:
      tags:
        - Rooms
      summary: Get a room by ID
      operationId: getRoomById
      responses:
        '200':
          description: Room found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Room not found

    put:
      tags:
        - Rooms
      summary: Update a room
      operationId: updateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '200':
          description: Room updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Room or hotel not found
        '409':
          description: Room number already exists
        '422':
          description: Validation error

    delete:
      tags:
        - Rooms
      summary: Delete a room
      operationId: deleteRoom
      responses:
        '204':
          description: Room deleted successfully
        '404':
          description: Room not found

components:
  schemas:

    Hotel:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Grand Hotel
        address:
          type: string
          example: Main Street 10
        city:
          type: string
          example: Berlin
        description:
          type: string
          example: Modern hotel in the city center
        phone:
          type: string
          example: "+49301234567"
        email:
          type: string
          format: email
          example: info@grandhotel.com
      required:
        - id
        - name
        - address
        - city
        - phone
        - email

    HotelInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          example: Grand Hotel
        address:
          type: string
          example: Main Street 10
        city:
          type: string
          example: Berlin
        description:
          type: string
          example: Modern hotel in the city center
        phone:
          type: string
          example: "+49301234567"
        email:
          type: string
          format: email
          example: info@grandhotel.com
      required:
        - name
        - address
        - city
        - phone
        - email

    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        hotelId:
          type: integer
          example: 1
        roomNumber:
          type: string
          example: "101"
        type:
          type: string
          enum:
            - single
            - double
            - suite
            - family
          example: double
        pricePerNight:
          type: number
          format: float
          minimum: 0
          example: 120.0
        capacity:
          type: integer
          minimum: 1
          example: 2
        description:
          type: string
          example: Double room with city view
      required:
        - id
        - hotelId
        - roomNumber
        - type
        - pricePerNight
        - capacity

    RoomInput:
      type: object
      properties:
        hotelId:
          type: integer
          example: 1
        roomNumber:
          type: string
          example: "101"
        type:
          type: string
          enum:
            - single
            - double
            - suite
            - family
          example: double
        pricePerNight:
          type: number
          format: float
          minimum: 0
          example: 120.0
        capacity:
          type: integer
          minimum: 1
          example: 2
        description:
          type: string
          example: Double room with city view
      required:
        - hotelId
        - roomNumber
        - type
        - pricePerNight
        - capacity
